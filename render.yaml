services:
  - type: web
    name: vr-ai-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:10000
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
