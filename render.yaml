services:
  - type: web
    name: vr-ai-server
    env: python
    buildCommand: python -m venv .venv && . .venv/bin/activate && python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: bash start.sh
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
